<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PhishGuard</title>

  <style>
    body {
      width: 330px;
      margin: 0;
      padding: 18px;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    .subtitle {
      color: #666;
      font-size: 13px;
      margin: 4px 0 15px;
    }

    .score {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      margin: 15px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
    }

    .score-number {
      font-size: 30px;
      font-weight: bold;
    }

    .risk {
      text-align: center;
      font-weight: bold;
      font-size: 18px;
    }

    .warning {
      background: white;
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      border-left: 4px solid #ef4444;
      font-size: 13px;
    }

    .safe {
      color: #15803d;
      border-left-color: #22c55e;
    }

    .error {
      color: #b91c1c;
    }

    .footer {
      margin-top: 15px;
      font-size: 11px;
      color: #777;
      text-align: center;
    }
  </style>
</head>

<body>

  <h1>🛡️ PhishGuard</h1>

  <div class="subtitle">
    Real-Time Phishing Detector
  </div>

  <div id="result">
    Analyzing website...
  </div>

  <div class="footer">
    Educational security tool
  </div>

  <script src="popup.js"></script>

</body>
</html>
